[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "open-linecaller-calibration"
version = "0.2.0"
description = "Open-LineCaller precision court calibration capability pack"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
